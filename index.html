
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102033">
<title>Money App | รายรับรายจ่าย</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:system-ui,sans-serif}
header{background:#102033;color:white;padding:24px 18px;border-radius:0 0 24px 24px}
h1{font-size:25px;margin:0}
small{color:#94a3b8}
.balance{font-size:36px;font-weight:800;margin:20px 0 4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:#ffffff15;padding:13px;border-radius:14px}
.stat b{display:block;font-size:20px;margin-top:5px}
main{max-width:700px;margin:auto;padding:15px}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:white;color:#172033}
.filters button.active,.primary{background:#102033;color:white}
.panel{background:white;border-radius:16px;padding:16px;margin-bottom:13px}
h2{font-size:17px;margin:0 0 12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.green{color:#15803d}.red{color:#dc2626}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white}
form label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.tx{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e2e8f0}
.tx:last-child{border-bottom:0}
.txinfo{flex:1;min-width:0}
.txname{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:12px;color:#64748b;margin-top:3px}
.amount{font-weight:800;white-space:nowrap}
.tx button{padding:7px;background:#f1f5f9}
.bar{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:#2563eb}
.rowcat{margin:12px 0;font-size:14px}
.empty{text-align:center;padding:24px;color:#64748b}
.actions{display:flex;gap:8px;margin-top:15px}
.actions button{flex:1}
footer{text-align:center;color:#64748b;font-size:12px;padding:15px}
</style>
</head>
<body>
<header>
  <h1>💰 Money App</h1>
  <small>จัดการเงินของคุณในทุกวัน</small>
  <div class="balance" id="balance">฿0</div>
  <small>ยอดคงเหลือทั้งหมด</small>
  <div class="stats">
    <div class="stat"><small>รายรับเดือนนี้</small><b id="income">฿0</b></div>
    <div class="stat"><small>รายจ่ายเดือนนี้</small><b id="expense">฿0</b></div>
  </div>
</header>

<main>
  <div class="filters">
    <button class="active" data-filter="month">เดือนนี้</button>
    <button data-filter="today">วันนี้</button>
    <button data-filter="all">ทั้งหมด</button>
  </div>

  <section class="panel">
    <h2>สรุปยอด</h2>
    <div class="summary">
      <div>รายรับ <b class="green" id="sumIncome">฿0</b></div>
      <div>รายจ่าย <b class="red" id="sumExpense">฿0</b></div>
    </div>
    <p>ยอดสุทธิ: <b id="net">฿0</b></p>
  </section>

  <section class="panel">
    <h2>เพิ่มรายการใหม่</h2>
    <form id="entryForm">
      <label for="type">ประเภท</label>
      <select id="type">
        <option value="expense">รายจ่าย</option>
        <option value="income">รายรับ</option>
      </select>

      <label for="amount">จำนวนเงิน (บาท)</label>
      <input id="amount" type="number" min="0.01" step="0.01"
        placeholder="เช่น 150" required>

      <label for="name">รายละเอียด</label>
      <input id="name" maxlength="100" placeholder="เช่น ค่าอาหาร" required>

      <label for="category">หมวดหมู่</label>
      <select id="category">
        <option>อาหาร</option>
        <option>เดินทาง</option>
        <option>รถยนต์</option>
        <option>บ้าน</option>
        <option>ช้อปปิ้ง</option>
        <option>บิลและค่าสาธารณูปโภค</option>
        <option>เงินเดือน</option>
        <option>ธุรกิจ</option>
        <option>อื่น ๆ</option>
      </select>

      <label for="date">วันที่</label>
      <input id="date" type="date" required>

      <div class="actions">
        <button class="primary" type="submit">＋ บันทึกรายการ</button>
        <button type="reset">ล้าง</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>รายจ่ายแยกตามหมวด</h2>
    <div id="categories"></div>
  </section>

  <section class="panel">
    <h2>ประวัติรายการ</h2>
    <input id="search" placeholder="🔎 ค้นหารายการ...">
    <div id="transactions"></div>
    <div class="actions">
      <button id="exportBtn">ส่งออกข้อมูล CSV</button>
      <button id="backupBtn">สำรองข้อมูล JSON</button>
    </div>
    <label for="importFile">นำเข้าข้อมูลสำรอง JSON</label>
    <input id="importFile" type="file" accept=".json,application/json">
  </section>
</main>
<footer>Money App · ข้อมูลเก็บไว้ในเบราว์เซอร์ของอุปกรณ์นี้</footer>

<script>
const KEY = "money-app-records-v1";
const $ = id => document.getElementById(id);
let records = [];
let filter = "month";

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (Array.isArray(saved)) records = saved;
} catch (e) {}

function today() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}
$("date").value = today();

function money(n) {
  return "฿" + Number(n || 0).toLocaleString("th-TH", {
    minimumFractionDigits: 0, maximumFractionDigits: 2
  });
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(records));
}
function total(list, type) {
  return list.filter(x => x.type === type)
    .reduce((sum,x) => sum + Number(x.amount), 0);
}
function safe(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}
function visible(x) {
  if (filter === "today") return x.date === today();
  if (filter === "month") return x.date.slice(0,7) === today().slice(0,7);
  return true;
}

function render() {
  const month = records.filter(x =>
    x.date.slice(0,7) === today().slice(0,7));
  $("balance").textContent =
    money(total(records,"income") - total(records,"expense"));
  $("income").textContent = money(total(month,"income"));
  $("expense").textContent = money(total(month,"expense"));

  const search = $("search").value.trim().toLowerCase();
  const list = records.filter(visible).filter(x =>
    (x.name + " " + x.category).toLowerCase().includes(search))
    .sort((a,b) => b.date.localeCompare(a.date) || b.id-a.id);

  const inc = total(list,"income");
  const exp = total(list,"expense");
  $("sumIncome").textContent = money(inc);
  $("sumExpense").textContent = money(exp);
  $("net").textContent = money(inc-exp);

  if (!list.length) {
    $("transactions").innerHTML =
      '<div class="empty">ยังไม่มีรายการในช่วงนี้</div>';
  } else {
    $("transactions").innerHTML = list.map(x => `
      <div class="tx">
        <div class="txinfo">
          <div class="txname">${safe(x.name)}</div>
          <div class="meta">${safe(x.category)} · ${safe(x.date)}</div>
        </div>
        <div class="amount ${x.type==="income"?"green":"red"}">
          ${x.type==="income"?"+":"−"}${money(x.amount)}
        </div>
        <button type="button" data-edit="${x.id}" aria-label="แก้ไข">✏️</button>
        <button type="button" data-delete="${x.id}" aria-label="ลบ">🗑️</button>
      </div>`).join("");
  }

  const cats = {};
  list.filter(x => x.type==="expense").forEach(x => {
    cats[x.category] = (cats[x.category] || 0) + Number(x.amount);
  });
  const entries = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  const max = entries.length ? entries[0][1] : 0;
  $("categories").innerHTML = entries.length ? entries.map(([name,value]) => `
    <div class="rowcat">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <span>${safe(name)}</span><b>${money(value)}</b>
      </div>
      <div class="bar"><span style="width:${max ? value/max*100 : 0}%"></span></div>
    </div>`).join("") :
    '<div class="empty">ยังไม่มีข้อมูลรายจ่าย</div>';
}

$("entryForm").addEventListener("submit", e => {
  e.preventDefault();
  const amount = Number($("amount").value);
  const name = $("name").value.trim();
  if (!Number.isFinite(amount) || amount <= 0 || !name) {
    alert("กรุณาตรวจสอบจำนวนเงินและรายละเอียด");
    return;
  }
  records.push({
    id: Date.now(),
    type: $("type").value,
    amount,
    name,
    category: $("category").value,
    date: $("date").value
  });
  save();
  $("entryForm").reset();
  $("date").value = today();
  render();
});

document.querySelectorAll("[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b =>
      b.classList.toggle("active", b === btn));
    render();
  });
});
$("search").addEventListener("input", render);

$("transactions").addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]");
  const del = e.target.closest("[data-delete]");
  if (edit) {
    const x = records.find(r => r.id === Number(edit.dataset.edit));
    if (!x) return;
    const name = prompt("แก้ไขรายละเอียด", x.name);
    if (name === null) return;
    const amount = prompt("แก้ไขจำนวนเงิน", x.amount);
    if (amount === null) return;
    if (!name.trim() || !Number.isFinite(Number(amount)) || Number(amount)<=0) {
      alert("ข้อมูลไม่ถูกต้อง"); return;
    }
    x.name = name.trim();
    x.amount = Number(amount);
    save(); render();
  }
  if (del) {
    const id = Number(del.dataset.delete);
    if (confirm("ต้องการลบรายการนี้หรือไม่?")) {
      records = records.filter(r => r.id !== id);
      save(); render();
    }
  }
});

function download(content, filename, mime) {
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$("backupBtn").addEventListener("click", () =>
  download(JSON.stringify(records,null,2),"money-backup.json","application/json"));

$("exportBtn").addEventListener("click", () => {
  const rows = [["วันที่","ประเภท","รายการ","หมวดหมู่","จำนวนเงิน"],
    ...records.map(x => [x.date,x.type,x.name,x.category,x.amount])];
  const csv = "\uFEFF" + rows.map(row =>
    row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",")
  ).join("\r\n");
  download(csv,"money-report.csv","text/csv;charset=utf-8");
});

$("importFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data) || !data.every(x =>
      x && ["income","expense"].includes(x.type) &&
      Number.isFinite(Number(x.amount)) && x.date && x.name
    )) throw new Error("invalid");
    if (confirm("นำเข้าข้อมูลและแทนที่รายการปัจจุบันทั้งหมดหรือไม่?")) {
      records = data.map(x => ({
        id:Number(x.id)||Date.now()+Math.random(),
        type:x.type, amount:Number(x.amount),
        name:String(x.name), category:String(x.category||"อื่น ๆ"),
        date:String(x.date)
      }));
      save(); render(); alert("นำเข้าข้อมูลสำเร็จ");
    }
  } catch (err) {
    alert("ไฟล์ไม่ถูกต้องหรือไม่ใช่ไฟล์สำรองของ Money App");
  }
  e.target.value = "";
});

render();
</script>
</body>
</html>
